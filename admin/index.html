<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - SPMB SMP KP 1 BALEENDAH</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        /* Login Page Styles */
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--gradient-hero);
            position: relative;
            overflow: hidden;
            padding: 20px;
        }

        /* Floating Decorative Shapes */
        .login-page .floating-shape {
            position: absolute;
            border-radius: 50%;
            opacity: 0.08;
            animation: floatShape 20s infinite ease-in-out;
        }

        .login-page .floating-shape:nth-child(1) {
            width: 300px;
            height: 300px;
            background: var(--accent-cyan);
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }

        .login-page .floating-shape:nth-child(2) {
            width: 200px;
            height: 200px;
            background: var(--secondary);
            top: 50%;
            right: -80px;
            animation-delay: -5s;
        }

        .login-page .floating-shape:nth-child(3) {
            width: 150px;
            height: 150px;
            background: var(--warning);
            bottom: -60px;
            left: 30%;
            animation-delay: -10s;
        }

        .login-page .floating-shape:nth-child(4) {
            width: 250px;
            height: 250px;
            background: var(--success);
            top: 20%;
            left: 60%;
            animation-delay: -15s;
        }

        @keyframes floatShape {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(30px, -30px) rotate(90deg); }
            50% { transform: translate(-20px, 20px) rotate(180deg); }
            75% { transform: translate(20px, 30px) rotate(270deg); }
        }

        /* Login Card */
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 48px 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 2;
            text-align: center;
            animation: cardSlideUp 0.6s ease-out;
        }

        @keyframes cardSlideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-card.shake {
            animation: shakeCard 0.5s ease-in-out;
        }

        @keyframes shakeCard {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-8px); }
            20%, 40%, 60%, 80% { transform: translateX(8px); }
        }

        .login-logo {
            font-size: 56px;
            margin-bottom: 8px;
            display: block;
            animation: bounceIn 0.8s ease-out 0.3s both;
        }

        @keyframes bounceIn {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }

        .login-title {
            font-size: 28px;
            font-weight: 800;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 4px;
        }

        .login-subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 32px;
            font-weight: 500;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-group {
            position: relative;
            text-align: left;
        }

        .input-group i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
            font-size: 16px;
            transition: color 0.3s;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px 14px 46px;
            border: 2px solid #e8ecf4;
            border-radius: 14px;
            font-size: 15px;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s;
            background: #f8f9fc;
            box-sizing: border-box;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(67, 97, 238, 0.1);
        }

        .input-group input:focus + i,
        .input-group input:focus ~ i {
            color: var(--primary);
        }

        .remember-row {
            display: flex;
            align-items: center;
            gap: 8px;
            text-align: left;
        }

        .remember-row input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .remember-row label {
            font-size: 14px;
            color: #666;
            cursor: pointer;
            user-select: none;
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            background: var(--gradient-primary);
            color: #fff;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(67, 97, 238, 0.4);
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(67, 97, 238, 0.5);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .login-btn .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .login-error {
            background: rgba(239, 71, 111, 0.1);
            color: var(--danger);
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            display: none;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(239, 71, 111, 0.2);
        }

        .login-error.show {
            display: flex;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 24px;
            color: #888;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: var(--primary);
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 36px 24px;
            }

            .login-logo {
                font-size: 44px;
            }

            .login-title {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="login-page">
        <!-- Floating Decorative Shapes -->
        <div class="floating-shape"></div>
        <div class="floating-shape"></div>
        <div class="floating-shape"></div>
        <div class="floating-shape"></div>

        <!-- Login Card -->
        <div class="login-card" id="loginCard">
            <span class="login-logo">🎓</span>
            <h1 class="login-title">Admin Panel</h1>
            <p class="login-subtitle">SPMB SMP KP 1 BALEENDAH</p>

            <form class="login-form" id="loginForm">
                <div class="input-group">
                    <input type="text" id="loginUsername" placeholder="Username" required autocomplete="username">
                    <i class="fas fa-user"></i>
                </div>

                <div class="input-group">
                    <input type="password" id="loginPassword" placeholder="Password" required autocomplete="current-password">
                    <i class="fas fa-lock"></i>
                </div>

                <div class="remember-row">
                    <input type="checkbox" id="rememberMe">
                    <label for="rememberMe">Ingat Saya</label>
                </div>

                <div class="login-error" id="loginError">
                    <i class="fas fa-exclamation-circle"></i>
                    <span id="loginErrorText">Username atau password salah!</span>
                </div>

                <button type="submit" class="login-btn" id="loginBtn">
                    <span class="spinner" id="loginSpinner"></span>
                    <span id="loginBtnText">Masuk</span>
                    <i class="fas fa-arrow-right" id="loginBtnIcon"></i>
                </button>
            </form>

            <a href="/" class="back-link">
                <i class="fas fa-arrow-left"></i>
                Kembali ke Beranda
            </a>
        </div>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/admin.js"></script>
</body>
</html>
